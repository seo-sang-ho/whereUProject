spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:whereu}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:whereu}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
