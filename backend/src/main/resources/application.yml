spring:
  application:
    name: whereU

tourism:
  open-api:
    base-url: ${TOURISM_OPEN_API_BASE_URL:}
    stay-strength-endpoint: ${TOURISM_STAY_STRENGTH_ENDPOINT:${TOURISM_DEMAND_ENDPOINT:/areaTarSjrnDsList}}
    service-key: ${TOURISM_OPEN_API_SERVICE_KEY:}
    mobile-os: ETC
    mobile-app: whereU
    stay-strength:
      base-ym: ${TOURISM_STAY_STRENGTH_BASE_YM:${TOURISM_DEMAND_BASE_YM:202509}}
      area-codes: ${TOURISM_STAY_STRENGTH_AREA_CODES:${TOURISM_DEMAND_AREA_CODES:11,26,27,28,29,30,31,36,41,43,44,46,47,48,50,51,52}}
      indicator-code: ${TOURISM_STAY_STRENGTH_INDICATOR_CODE:${TOURISM_DEMAND_INDICATOR_CODE:21}}
  resource-demand-api:
    base-url: ${TOURISM_RESOURCE_DEMAND_BASE_URL:https://apis.data.go.kr/B551011/AreaTarResDemService}
    service-demand-endpoint: ${TOURISM_SERVICE_DEMAND_ENDPOINT:/areaTarSvcDemList}
    cultural-resource-demand-endpoint: ${TOURISM_CULTURAL_RESOURCE_DEMAND_ENDPOINT:/areaCulResDemList}
    service-key: ${TOURISM_OPEN_API_SERVICE_KEY:}
    mobile-os: ETC
    mobile-app: whereU
    service-demand:
      base-ym: ${TOURISM_SERVICE_DEMAND_BASE_YM:${TOURISM_STAY_STRENGTH_BASE_YM:${TOURISM_DEMAND_BASE_YM:202509}}}
      area-codes: ${TOURISM_SERVICE_DEMAND_AREA_CODES:11,26,27,28,29,30,31,36,41,43,44,46,47,48,50,51,52}
      indicator-code: ${TOURISM_SERVICE_DEMAND_INDICATOR_CODE:11}
  content-api:
    base-url: ${TOURISM_CONTENT_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    area-based-list-endpoint: ${TOURISM_CONTENT_AREA_BASED_LIST_ENDPOINT:/areaBasedList2}
    service-key: ${TOURISM_CONTENT_API_SERVICE_KEY:${TOURISM_OPEN_API_SERVICE_KEY:}}
    admin-token: ${TOURISM_CONTENT_ADMIN_TOKEN:}
    mobile-os: ETC
    mobile-app: whereU

naver:
  maps:
    geocoding-base-url: ${NAVER_MAPS_GEOCODING_BASE_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}
    directions-base-url: ${NAVER_MAPS_DIRECTIONS_BASE_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}
    directions-connect-timeout: ${NAVER_DIRECTIONS_CONNECT_TIMEOUT:3s}
    directions-read-timeout: ${NAVER_DIRECTIONS_READ_TIMEOUT:7s}
    directions-monthly-safe-limit: ${NAVER_DIRECTIONS_MONTHLY_SAFE_LIMIT:50000}
    directions-cache-ttl-minutes: ${NAVER_DIRECTIONS_CACHE_TTL_MINUTES:10}
    directions-cache-maximum-size: ${NAVER_DIRECTIONS_CACHE_MAXIMUM_SIZE:10000}
    api-key-id: ${NAVER_MAPS_API_KEY_ID:}
    api-key: ${NAVER_MAPS_API_KEY:}
