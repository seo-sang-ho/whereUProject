spring:
  datasource:
    url: jdbc:h2:mem:whereu-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

naver:
  maps:
    directions-connect-timeout: 3s
    directions-read-timeout: 7s
    directions-monthly-safe-limit: 50000

directions:
  rate-limit:
    enabled: true
    minute-capacity: 10
    minute-refill-tokens: 10
    daily-capacity: 100
    cache-maximum-size: 10000
    cache-expire-after-hours: 24
