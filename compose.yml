services:
  mysql:
    image: mysql:8.4
    container_name: whereu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whereu}
      MYSQL_USER: ${MYSQL_USER:-whereu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - whereu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  whereu_mysql_data:
